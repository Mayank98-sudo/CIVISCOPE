name: Collect live Delhi sensors
on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
  push:
    paths:
      - src/live_feed.py
      - .github/workflows/live-monitoring.yml
permissions:
  contents: write
concurrency:
  group: live-sensor-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests==2.34.2 python-dotenv==1.2.3
      - name: Collect validated measurements
        run: python -m src.live_feed
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      - name: Persist feed and diagnostic status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live/latest.json live/status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update selected Delhi sensor observations'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
